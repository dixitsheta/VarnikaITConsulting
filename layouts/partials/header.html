<header class="site-header">
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/" class="logo">
                    <img src="/images/logo/logo-dark.svg" alt="{{ .Site.Title }}" class="logo-image logo-dark" width="200" height="50">
                    <img src="/images/logo/logo-light.svg" alt="{{ .Site.Title }}" class="logo-image logo-light" width="200" height="50">
                </a>
                <button class="navbar-toggle" aria-label="Toggle navigation">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
            
            <div class="navbar-menu">
                <ul class="navbar-nav">
                    {{ range .Site.Menus.main }}
                    <li class="nav-item{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
                        <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
                    </li>
                    {{ end }}
                </ul>
                
                <div class="navbar-search">
                    <div class="header-search-wrapper">
                        <span class="header-search-icon">🔍</span>
                        <input type="text" id="header-search-input" placeholder="Search..." />
                        <button id="header-clear-btn" class="header-clear-btn" style="display: none;">Clear</button>
                    </div>
                    <div id="header-search-results" class="header-search-results"></div>
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <span class="theme-icon theme-icon-light">🌙</span>
                        <span class="theme-icon theme-icon-dark">☀️</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
</header>

<style>
/* Inline search in header */
.navbar-menu {
    display: flex;
    align-items: center;
    gap: 2rem;
}

.navbar-search {
    display: flex;
    align-items: center;
    gap: 1rem;
    min-width: 250px;
    position: relative;
}

/* Header search wrapper */
.header-search-wrapper {
    position: relative;
    width: 100%;
}

/* Search icon */
.header-search-icon {
    position: absolute;
    left: 0.85rem;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    z-index: 2;
    font-size: 0.875rem;
}

/* Search input */
#header-search-input {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 0.5rem 3rem 0.5rem 2.5rem;
    font-size: 0.9rem;
    color: var(--text-primary);
    transition: all 0.3s ease;
    width: 100%;
    box-sizing: border-box;
}

#header-search-input:focus {
    border-color: var(--color-gold);
    outline: none;
    box-shadow: 0 0 0 2px rgba(244, 196, 48, 0.1);
}

/* Clear button */
.header-clear-btn {
    position: absolute;
    right: 0.75rem;
    top: 50%;
    transform: translateY(-50%);
    background: var(--bg-secondary);
    color: var(--text-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: 0.25rem 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    z-index: 2;
}

.header-clear-btn:hover {
    background: var(--color-gold);
    color: var(--color-navy);
    border-color: var(--color-gold);
}

/* Search results drawer */
.header-search-results {
    position: absolute;
    top: calc(100% + 0.5rem);
    right: 0;
    background: var(--bg-primary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    width: 500px;
    max-height: 450px;
    display: none;
    flex-direction: column;
    z-index: 9999;
    overflow: hidden;
}

.header-search-results.active {
    display: flex;
}

.header-search-results-content {
    overflow-y: auto;
    max-height: 350px;
    flex: 1;
    padding: 0.5rem;
}

.header-search-result {
    border-left: 3px solid var(--color-gold);
    padding: 1rem;
    margin-bottom: 0.5rem;
    border-radius: 4px;
    transition: background 0.2s ease;
}

.header-search-result:hover {
    background: var(--bg-secondary);
}

.header-search-result h3 {
    color: var(--text-primary);
    font-size: 1rem;
    font-weight: 600;
    margin: 0 0 0.5rem 0;
}

.header-search-result h3 a {
    color: var(--text-primary);
    text-decoration: none;
}

.header-search-result h3 a:hover {
    color: var(--color-gold);
}

.header-search-result p {
    color: var(--text-secondary);
    font-size: 0.875rem;
    margin: 0;
    line-height: 1.4;
}

.header-search-message {
    color: var(--text-secondary);
    font-size: 0.875rem;
    padding: 1rem;
    text-align: center;
}

.header-search-loading {
    color: var(--color-gold);
    text-align: center;
    padding: 1rem;
}

/* Search actions */
.header-search-actions {
    display: flex;
    gap: 0.5rem;
    padding: 0.75rem;
    border-top: 1px solid var(--border-color);
    background: var(--bg-secondary);
    position: sticky;
    bottom: 0;
    border-radius: 0 0 8px 8px;
}

.header-see-all {
    flex: 1;
    padding: 0.75rem 1rem;
    background: var(--color-navy);
    color: var(--bg-primary);
    border: 1px solid var(--color-navy);
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.875rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s ease;
    text-decoration: none;
    display: inline-block;
}

.header-see-all:hover {
    background: var(--color-gold);
    color: var(--color-navy);
    border-color: var(--color-gold);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    let pagefind;
    
    async function initPagefind() {
        if (!pagefind) {
            pagefind = await import('/pagefind/pagefind.js');
        }
        return pagefind;
    }
    
    const input = document.getElementById('header-search-input');
    const clearBtn = document.getElementById('header-clear-btn');
    const resultsContainer = document.getElementById('header-search-results');
    
    let searchTimeout;
    
    async function performHeaderSearch(query) {
        if (!query.trim()) {
            resultsContainer.classList.remove('active');
            resultsContainer.innerHTML = '';
            return;
        }
        
        resultsContainer.classList.add('active');
        resultsContainer.innerHTML = '<div class="header-search-loading">Searching...</div>';
        
        try {
            const pf = await initPagefind();
            const search = await pf.search(query);
            
            if (search.results.length === 0) {
                resultsContainer.innerHTML = '<div class="header-search-message">No results found</div>';
                return;
            }
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'header-search-results-content';
            
            for (const result of search.results.slice(0, 5)) {
                const data = await result.data();
                
                const resultDiv = document.createElement('div');
                resultDiv.className = 'header-search-result';
                resultDiv.innerHTML = `
                    <h3><a href="${data.url}">${data.meta.title || 'Untitled'}</a></h3>
                    <p>${data.excerpt}</p>
                `;
                contentDiv.appendChild(resultDiv);
            }
            
            resultsContainer.innerHTML = '';
            resultsContainer.appendChild(contentDiv);
            
            // Add See All button
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'header-search-actions';
            
            const seeAllBtn = document.createElement('a');
            seeAllBtn.href = '/search/?q=' + encodeURIComponent(query);
            seeAllBtn.className = 'header-see-all';
            seeAllBtn.textContent = 'See All Results';
            
            actionsDiv.appendChild(seeAllBtn);
            resultsContainer.appendChild(actionsDiv);
            
        } catch (error) {
            console.error('Search error:', error);
            resultsContainer.innerHTML = '<div class="header-search-message">Search error occurred</div>';
        }
    }
    
    // Handle input changes
    input.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        
        if (input.value.trim()) {
            clearBtn.style.display = 'block';
            searchTimeout = setTimeout(() => performHeaderSearch(input.value), 300);
        } else {
            clearBtn.style.display = 'none';
            resultsContainer.classList.remove('active');
            resultsContainer.innerHTML = '';
        }
    });
    
    // Handle clear button
    clearBtn.addEventListener('click', function() {
        input.value = '';
        clearBtn.style.display = 'none';
        resultsContainer.classList.remove('active');
        resultsContainer.innerHTML = '';
        input.focus();
    });
    
    // Close results when clicking outside
    document.addEventListener('click', function(e) {
        if (!e.target.closest('.navbar-search')) {
            resultsContainer.classList.remove('active');
        }
    });
    
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    }
});
</script>
