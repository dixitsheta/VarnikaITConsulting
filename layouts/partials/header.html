<header class="site-header">
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <a href="/" class="logo">
                    <img src="/images/logo/logo-dark.svg" alt="{{ .Site.Title }}" class="logo-image logo-dark" width="200" height="50">
                    <img src="/images/logo/logo-light.svg" alt="{{ .Site.Title }}" class="logo-image logo-light" width="200" height="50">
                </a>
                <div class="navbar-actions">
                    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">
                        <span class="theme-icon theme-icon-light">🌙</span>
                        <span class="theme-icon theme-icon-dark">☀️</span>
                    </button>
                    <button class="navbar-toggle" aria-label="Toggle navigation">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
            
            <div class="navbar-menu">
                <ul class="navbar-nav">
                    {{ range .Site.Menus.main }}
                    <li class="nav-item{{ if $.IsMenuCurrent "main" . }} active{{ end }}">
                        <a href="{{ .URL }}" class="nav-link">{{ .Name }}</a>
                    </li>
                    {{ end }}
                    <li class="nav-item">
                        <button id="search-button" class="nav-link search-button" aria-label="Open search">
                            🔍 Search
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>

<!-- Search Modal -->
<div id="search-modal" class="search-modal">
    <div class="search-modal-content">
        <div class="search-modal-header">
            <h2 style="color: #003366; margin: 0;">Search</h2>
            <button id="close-search" class="close-search" aria-label="Close search">&times;</button>
        </div>
        <div id="search-container"></div>
        <div id="see-all-container" class="see-all-container" style="display: none;">
            <a href="/search/" class="see-all-button">See All Results →</a>
        </div>
    </div>
</div>

<style>
.search-button {
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.75rem 1rem;
    font-size: 1rem;
    font-family: inherit;
}

.search-modal {
    display: none;
    position: fixed;
    z-index: 10000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    animation: fadeIn 0.2s ease;
}

.search-modal.active {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
}

.search-modal-content {
    background: white;
    border-radius: 12px;
    width: 90%;
    max-width: 800px;
    max-height: 80vh;
    overflow: hidden;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    animation: slideDown 0.3s ease;
}

.search-modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.5rem 2rem;
    border-bottom: 2px solid #F4C430;
}

.close-search {
    background: none;
    border: none;
    font-size: 2rem;
    cursor: pointer;
    color: #666;
    line-height: 1;
    transition: color 0.2s ease;
}

.close-search:hover {
    color: #003366;
}

#search-container {
    padding: 1rem 2rem 0;
    max-height: calc(80vh - 160px);
    overflow-y: auto;
}

.see-all-container {
    padding: 1.5rem 2rem;
    border-top: 2px solid #F7F9FC;
    text-align: center;
}

.see-all-button {
    display: inline-block;
    padding: 0.75rem 2rem;
    background: #F4C430;
    color: #003366;
    text-decoration: none;
    border-radius: 6px;
    font-weight: 600;
    transition: all 0.3s ease;
}

.see-all-button:hover {
    background: #DAA520;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(244, 196, 48, 0.3);
}

/* Pagefind UI Customization */
#search-container .pagefind-ui__search-input {
    border: 2px solid #e0e0e0;
    border-radius: 8px;
    padding: 1rem;
    font-size: 1.1rem;
    width: 100%;
    transition: border-color 0.3s ease;
}

#search-container .pagefind-ui__search-input:focus {
    border-color: #F4C430;
    outline: none;
    box-shadow: 0 0 0 3px rgba(244, 196, 48, 0.1);
}

#search-container .pagefind-ui__result {
    border-left: 3px solid #F4C430;
    padding-left: 1rem;
    margin-bottom: 1.5rem;
}

#search-container .pagefind-ui__result-link {
    color: #003366;
    font-weight: 600;
    font-size: 1.1rem;
}

#search-container .pagefind-ui__result-link:hover {
    color: #F4C430;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 768px) {
    .search-modal-content {
        width: 95%;
        max-height: 90vh;
    }
    
    .search-modal-header {
        padding: 1rem 1.5rem;
    }
    
    #search-container {
        padding: 1rem 1.5rem 1.5rem;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchButton = document.getElementById('search-button');
    const searchModal = document.getElementById('search-modal');
    const closeSearch = document.getElementById('close-search');
    const searchContainer = document.getElementById('search-container');
    
    let pagefindUI = null;
    
    // Open search modal
    searchButton.addEventListener('click', function() {
        searchModal.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // Initialize Pagefind UI if not already done
        if (!pagefindUI) {
            pagefindUI = new PagefindUI({
                element: "#search-container",
                showSubResults: true,
                showImages: false,
                excerptLength: 15,
                resetStyles: false
            });
            
            // Show "See All" button when results appear
            const observer = new MutationObserver(function() {
                const results = searchContainer.querySelector('.pagefind-ui__results');
                const seeAllContainer = document.getElementById('see-all-container');
                if (results && results.children.length > 0) {
                    seeAllContainer.style.display = 'block';
                } else {
                    seeAllContainer.style.display = 'none';
                }
            });
            
            observer.observe(searchContainer, { childList: true, subtree: true });
        }
        
        // Focus search input
        setTimeout(() => {
            const searchInput = searchContainer.querySelector('.pagefind-ui__search-input');
            if (searchInput) {
                searchInput.focus();
            }
        }, 100);
    });
    
    // Close search modal
    function closeSearchModal() {
        searchModal.classList.remove('active');
        document.body.style.overflow = '';
    }
    
    closeSearch.addEventListener('click', closeSearchModal);
    
    // Close on background click
    searchModal.addEventListener('click', function(e) {
        if (e.target === searchModal) {
            closeSearchModal();
        }
    });
    
    // Close on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && searchModal.classList.contains('active')) {
            closeSearchModal();
        }
    });
    
    // Theme toggle
    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        });
    }
});
</script>
