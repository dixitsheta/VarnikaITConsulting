{{ define "main" }}

<!-- Hero Section -->
<div style="background: linear-gradient(135deg, var(--color-navy) 0%, var(--color-navy-dark) 100%); color: var(--bg-primary); padding: 4rem 0; text-align: center;">
    <div class="container">
        <h1 style="font-size: 3rem; margin-bottom: 1rem; color: var(--bg-primary);">{{ .Title }}</h1>
        {{ if .Description }}
        <p style="font-size: 1.2rem; opacity: 0.95; max-width: 800px; margin: 0 auto;">{{ .Description }}</p>
        {{ end }}
    </div>
</div>

<div style="max-width: 1200px; margin: 0 auto; padding: 4rem 2rem;">
    <div style="margin-bottom: 3rem;">
        {{ .Content }}
    </div>
    
    {{ if .Pages }}
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 2rem;">
        {{ range .Pages }}
        <article style="background: var(--bg-primary); padding: 2rem; border-radius: 12px; box-shadow: var(--shadow-md); border-top: 4px solid var(--color-gold); transition: transform 0.3s ease;">
            <h2 style="color: var(--color-navy); font-size: 1.5rem; margin-bottom: 1rem;">
                <a href="{{ .RelPermalink }}" style="color: var(--color-navy); text-decoration: none;">{{ .Title }}</a>
            </h2>
            {{ if .Description }}
            <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">{{ .Description }}</p>
            {{ else if .Summary }}
            <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem;">{{ .Summary }}</p>
            {{ end }}
            <a href="{{ .RelPermalink }}" style="color: var(--color-gold); font-weight: 600; text-decoration: none;">Read More →</a>
        </article>
        {{ end }}
    </div>
    {{ end }}
</div>

{{ end }}
