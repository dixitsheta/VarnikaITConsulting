{{ define "main" }}
<article class="single-page">
    <div class="container">
        <header class="page-header">
            <h1>{{ .Title }}</h1>
            {{ if .Date }}
            <p class="page-meta">
                <time datetime="{{ .Date.Format "2006-01-02" }}">
                    {{ .Date.Format "January 2, 2006" }}
                </time>
            </p>
            {{ end }}
        </header>
        
        <div class="page-content">
            {{ .Content }}
        </div>
    </div>
</article>
{{ end }}
