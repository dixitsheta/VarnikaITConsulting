<ul class="checkmark-list" style="list-style: none; padding-left: 0;">
{{ .Inner | markdownify }}
</ul>

<style>
.checkmark-list li {
  padding-left: 2rem;
  position: relative;
  margin-bottom: 0.75rem;
}

.checkmark-list li::before {
  content: '✓';
  position: absolute;
  left: 0;
  color: var(--color-gold);
  font-weight: bold;
  font-size: 1.2rem;
}
</style>
